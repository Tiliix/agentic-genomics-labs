name: Public repository boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_public_boundary.py --all
